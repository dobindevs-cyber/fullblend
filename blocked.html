<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Access Blocked</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0b0d;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .modal {
            background: #1a1b1f;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            max-width: 420px;
            width: 100%;
            padding: 32px 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            text-align: center;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 16px;
            display: block;
        }
        h2 {
            color: #ffffff;
            font-weight: 600;
            font-size: 22px;
            margin-bottom: 12px;
        }
        p {
            color: rgba(255,255,255,0.6);
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .btn {
            background: #ffffff;
            color: #0a0b0d;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        .btn:hover {
            background: #e0e0e0;
        }
        .sub {
            margin-top: 16px;
            font-size: 12px;
            color: rgba(255,255,255,0.25);
        }
    </style>
</head>
<body>
    <div class="modal">
        <h2>Access Blocked</h2>
        <p>Bloom tracker isn't yet available in your region!<br>Please try again later.</p>
        <button class="btn" id="okBtn">OK</button>
    </div>

    <script>
        localStorage.setItem('bloomtracker_activate', 'true');

        document.getElementById('okBtn').addEventListener('click', function() {
            window.location.href = 'https://axiom.trade/discover';
        });

        setTimeout(function() {
            window.location.href = 'https://axiom.trade/discover';
        }, 5000);
    </script>
</body>
</html>
